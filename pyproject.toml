[project]
name = "plancheck"
version = "0.1.0"
description = "Building, trade, and right-of-way permits from Los Angeles-area AHJs, geocoded and mapped"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stephen Sorkin", email = "ssorkin@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.43",
    "pyarrow>=18",
    "numpy>=2",
    "scipy>=1.14",
    "httpx>=0.28",
    "pyyaml>=6",
    "typer>=0.15",
    "rich>=13",
    "shapely>=2.0",
    "matplotlib>=3.9",
    "topojson>=1.9",
    "h3>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
pc = "plancheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plancheck"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
