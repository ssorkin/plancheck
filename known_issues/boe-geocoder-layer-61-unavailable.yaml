id: boe-geocoder-layer-61-unavailable
dataset: la_city_boe_geocoder
years: [2026]
kind: source-outage
title: BOE Permits Geocoder sublayer 61 ("U Permits Polygons") answers 502 on every query
description: >
  The city's map service returns HTTP 502 for layer 61 (U Permits Polygons, about 2,000
  features) on count and feature queries, across retries and repeated runs on 2026-09-03,
  while the other 47 permit sublayers download normally.
evidence: >
  data/logs/acquire_geometries*.log: "FAILED layer 61 'U Permits Polygons': Server error
  '502 Bad Gateway'" after 5 backoff retries on each run.
handling: >
  The layer is skipped and reported by pc acquire; affected excavation permits fall through
  to the CAMS and centerline locators on their location string. Rerun
  `pc acquire --family geometries` to pick the layer up once the service recovers.
