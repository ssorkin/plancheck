# plancheck.sorkinlabs.com — LA Permit Atlas, a single static page from github.com/ssorkin/plancheck
# Cloudflare proxies the hostname to dronesclub. Cert: certbot webroot (/var/www/letsencrypt). Install:
#   sudo cp contrib/nginx/plancheck.sorkinlabs.com.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/plancheck.sorkinlabs.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name plancheck.sorkinlabs.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://plancheck.sorkinlabs.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plancheck.sorkinlabs.com;

    ssl_certificate     /etc/letsencrypt/live/plancheck.sorkinlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plancheck.sorkinlabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/plancheck-current;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The atlas is one self-contained page rebuilt on each refresh; keep caches short.
    location = /index.html { add_header Cache-Control "public, max-age=600"; }
    location /data/ { add_header Cache-Control "public, max-age=3600"; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
